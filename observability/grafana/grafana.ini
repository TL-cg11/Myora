[server]
protocol = http
http_addr = 127.0.0.1
http_port = 3000
domain = myora.tail94d373.ts.net
root_url = https://%(domain)s/grafana/
serve_from_sub_path = true

[security]
allow_embedding = true

[auth]
disable_login_form = true

[auth.anonymous]
enabled = false

[auth.proxy]
enabled = true
header_name = X-WEBAUTH-USER
header_property = username
auto_sign_up = true
sync_ttl = 60
whitelist = 127.0.0.1

[users]
allow_sign_up = false
auto_assign_org_role = Viewer
