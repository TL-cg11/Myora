apiVersion: 1

groups:
  - orgId: 1
    name: luck-security-consumer-health
    folder: Security Monitoring
    interval: 1m
    rules:
      - uid: luck-security-lag-high
        title: Security consumer lag is high
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 600, to: 0}
            model:
              datasource: {type: prometheus, uid: prometheus}
              editorMode: code
              expr: max by (consumer_group, topic) (luck_consumer_lag_messages)
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              reducer: max
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [1000], type: gt}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {params: [], type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              refId: C
              type: threshold
        dashboardUid: luck-security-consumers
        panelId: 1
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: Security sink consumer lag exceeded 1000 messages for 5 minutes.
          runbook_url: docs/security-monitoring-operations.md
        labels: {component: kafka-consumer, severity: warning, owner: security-monitoring}

      - uid: luck-security-dlq-detected
        title: Security sink DLQ message detected
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 600, to: 0}
            model:
              datasource: {type: prometheus, uid: prometheus}
              editorMode: code
              expr: sum by (consumer_group, topic, stage) (increase(luck_sink_dlq_total[5m]) or (luck_sink_dlq_total unless luck_sink_dlq_total offset 5m))
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              reducer: max
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [0], type: gt}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {params: [], type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              refId: C
              type: threshold
        dashboardUid: luck-security-consumers
        panelId: 4
        noDataState: OK
        execErrState: Alerting
        for: 0s
        annotations:
          summary: At least one security sink message entered a DLQ in the last 5 minutes.
          runbook_url: docs/security-monitoring-operations.md
        labels: {component: kafka-consumer, severity: critical, owner: security-monitoring}

      - uid: luck-security-sink-down
        title: Security sink metrics target is down
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 600, to: 0}
            model:
              datasource: {type: prometheus, uid: prometheus}
              editorMode: code
              expr: up{job="luck-security-sinks"}
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              reducer: min
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [1], type: lt}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {params: [], type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              refId: C
              type: threshold
        dashboardUid: luck-security-consumers
        panelId: 5
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        annotations:
          summary: A security sink metrics target has been unavailable for 2 minutes.
          runbook_url: docs/security-monitoring-operations.md
        labels: {component: observability, severity: critical, owner: security-monitoring}

      - uid: luck-security-lag-critical
        title: Security consumer lag is critical
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 600, to: 0}
            model:
              datasource: {type: prometheus, uid: prometheus}
              editorMode: code
              expr: max by (consumer_group, topic) (luck_consumer_lag_messages)
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              reducer: max
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [5000], type: gt}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {params: [], type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              refId: C
              type: threshold
        dashboardUid: luck-security-consumers
        panelId: 1
        noDataState: OK
        execErrState: Alerting
        for: 0s
        annotations:
          summary: Security sink consumer lag exceeded 5000 messages.
          runbook_url: docs/security-monitoring-operations.md
        labels: {component: kafka-consumer, severity: critical, owner: security-monitoring}

      - uid: luck-security-message-stale
        title: Security consumer oldest message is stale
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 600, to: 0}
            model:
              datasource: {type: prometheus, uid: prometheus}
              editorMode: code
              expr: max by (consumer_group, topic) (luck_consumer_oldest_message_age_seconds)
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              reducer: max
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [60], type: gt}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {params: [], type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              refId: C
              type: threshold
        dashboardUid: luck-security-consumers
        panelId: 1
        noDataState: OK
        execErrState: Alerting
        for: 0s
        annotations:
          summary: A security sink consumer is processing messages older than 60 seconds.
          runbook_url: docs/security-monitoring-operations.md
        labels: {component: kafka-consumer, severity: critical, owner: security-monitoring}

  - orgId: 1
    name: luck-suricata-flood-alerts
    folder: Security Monitoring
    interval: 1m
    rules:
      - uid: luck-ids-flood-detected
        title: IDS Flood attack detected
        condition: C
        data:
          - refId: A
            queryType: instant
            datasourceUid: loki
            relativeTimeRange: {from: 120, to: 0}
            model:
              datasource: {type: loki, uid: loki}
              editorMode: code
              expr: 'sum by (attack_type, severity) (count_over_time({job="luck-suricata-ids"} | json | attack_type=~"tcp_syn_flood|udp_flood|icmp_flood|web_connection_flood" [1m])) or on() vector(0)'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: instant
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              reducer: max
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [0], type: gt}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {params: [], type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              refId: C
              type: threshold
        dashboardUid: luck-suricata-ids
        panelId: 1
        noDataState: OK
        execErrState: Error
        for: 0s
        keepFiringFor: 2m
        annotations:
          flood_count: '{{ printf "%.0f" $values.B.Value }}'
          summary: '최근 1분간 {{ $labels.attack_type }} 공격 {{ printf "%.0f" $values.B.Value }}건 탐지'
          runbook_url: docs/security-monitoring-operations.md
        labels: {component: suricata-ids, notification_scope: ids-flood, owner: security-monitoring}

deleteContactPoints:
  - orgId: 1
    uid: luck-security-slack
  - orgId: 1
    uid: luck-security-email

contactPoints:
  - orgId: 1
    name: Luck Security Operations
    receivers:
      - uid: luck-security-discord
        type: discord
        disableResolveMessage: false
        settings:
          url: $GRAFANA_DISCORD_WEBHOOK_URL
          use_discord_username: true
  - orgId: 1
    name: Luck IDS Flood Alerts
    receivers:
      - uid: luck-ids-flood-discord
        type: discord
        disableResolveMessage: false
        settings:
          url: $GRAFANA_DISCORD_WEBHOOK_URL
          use_discord_username: true
          message: '{{ template "luck.ids.flood.message" . }}'

templates:
  - orgId: 1
    name: luck-ids-flood-message
    template: |
      {{ define "luck.ids.attack_name" -}}
      {{- if eq . "tcp_syn_flood" -}}TCP SYN Flood
      {{- else if eq . "udp_flood" -}}UDP Flood
      {{- else if eq . "icmp_flood" -}}ICMP Flood
      {{- else if eq . "web_connection_flood" -}}Web Connection Flood
      {{- else -}}{{ . }}{{- end -}}
      {{- end }}
      {{ define "luck.ids.severity_name" -}}
      {{- if eq . "critical" -}}긴급
      {{- else if eq . "high" -}}높음
      {{- else if eq . "medium" -}}주의
      {{- else -}}{{ . }}{{- end -}}
      {{- end }}
      {{ define "luck.ids.flood.message" -}}
      {{- range .Alerts.Firing }}
      🔴 **Luck IDS Flood 공격 알림**
      • 공격 유형: {{ template "luck.ids.attack_name" .Labels.attack_type }}
      • 위험도: {{ template "luck.ids.severity_name" .Labels.severity }}
      • 탐지 건수: 최근 1분간 {{ .Annotations.flood_count }}건
      • 대상 서비스: Nginx / Suricata IDS
      {{ end -}}
      {{- range .Alerts.Resolved }}
      ✅ **Luck IDS Flood 공격 종료**
      • 공격 유형: {{ template "luck.ids.attack_name" .Labels.attack_type }}
      • 상태: 최근 1분간 추가 탐지 없음
      {{ end -}}
      {{- end }}

policies:
  - orgId: 1
    receiver: Luck Security Operations
    group_by: [grafana_folder, alertname, consumer_group, topic]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: Luck IDS Flood Alerts
        object_matchers:
          - [notification_scope, '=', ids-flood]
        group_by: [alertname, attack_type, severity]
        group_wait: 0s
        group_interval: 1m
        repeat_interval: 10m
