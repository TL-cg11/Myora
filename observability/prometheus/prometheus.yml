global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: luck-security-sinks
    file_sd_configs:
      - files: ["/etc/prometheus/kafka-consumer-targets.yml"]

  - job_name: luck-ids-shipper
    file_sd_configs:
      - files: ["/etc/prometheus/ids-shipper-targets.yml"]
