server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 127.0.0.1:8080;
    server_name _;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(self)" always;

    location = /nginx-health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"luck-nginx"}\n';
    }

    # Preserve EveBox's relative asset paths when the trailing slash is omitted.
    location = /suricata {
        absolute_redirect off;
        return 308 /suricata/;
    }

    location /suricata/ {
        proxy_pass http://127.0.0.1:5636/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
        proxy_redirect ~^/(.*)$ /suricata/$1;
    }

    # The dashboard route is protected at the edge too, so a direct browser
    # request cannot receive the SPA shell before the admin check succeeds.
    location = /dashboard {
        auth_request /_auth/admin;
        proxy_pass http://100.66.77.55:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /grafana {
        return 308 /grafana/;
    }

    # Internal-only authorization subrequest. The WAS cookie is forwarded;
    # client-supplied Grafana identity headers are never trusted.
    location = /_auth/admin {
        internal;
        proxy_pass http://100.66.77.55:8000/api/auth/admin-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Original-URI $request_uri;
    }

    location /grafana/ {
        auth_request /_auth/admin;
        auth_request_set $grafana_user $upstream_http_x_auth_request_user;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-WEBAUTH-USER $grafana_user;
        proxy_set_header X-WEBAUTH-ROLE "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_redirect off;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
    }

    location / {
        proxy_pass http://100.66.77.55:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
