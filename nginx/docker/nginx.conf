# Docker 전용 nginx.conf. 서버용 nginx.conf 와 같은 구조에 JSON access log 를 추가했다.
# JSON 로그는 Fluent Bit 이 tail 해서 Kafka `myohan.nginx.access` 로 보낸다
# (필드 이름은 was/security-monitoring/detector/adapter/normalize.py 의 nginx 정규화와 맞춘다).
user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events { worker_connections 768; }

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format luck_json escape=json
        '{"timestamp":"$time_iso8601",'
        '"source":"nginx",'
        '"service":"luck-nginx",'
        '"request_id":"$request_id",'
        '"client_ip":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"request":"$request",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent"}';

    access_log /var/log/nginx/access.log;
    access_log /var/log/nginx/access.json.log luck_json;
    error_log /var/log/nginx/error.log;

    map $http_x_forwarded_proto $proxy_forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    include /etc/nginx/conf.d/*.conf;
}
