# Nginx JSON access log → Kafka `myohan.nginx.access`
# 서버 환경에서 Fluent Bit 이 하던 역할을 compose 안에서 재현한다.
[SERVICE]
    Flush         1
    Daemon        Off
    Log_Level     info
    Parsers_File  /fluent-bit/etc/parsers.conf
    Storage.path  /fluent-bit/state/storage

[INPUT]
    Name              tail
    Tag               nginx.access
    Path              /var/log/nginx/access.json.log
    Parser            json
    DB                /fluent-bit/state/tail.db
    Read_From_Head    Off
    Refresh_Interval  5
    Skip_Long_Lines   On
    Skip_Empty_Lines  On
    storage.type      filesystem

[OUTPUT]
    Name                          kafka
    Match                         nginx.access
    Brokers                       ${KAFKA_BOOTSTRAP_SERVERS}
    Topics                        myohan.nginx.access
    Format                        json
    Timestamp_Key                 @timestamp
    Timestamp_Format              iso8601
    Message_Key_Field             request_id
    Retry_Limit                   False
    rdkafka.request.required.acks 1
    rdkafka.log.connection.close  false
