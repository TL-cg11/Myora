# Docker 전용 서버 블록. 서버용 conf.d/luck.conf 와 차이:
#   - upstream 이 Tailscale IP 가 아니라 compose 서비스 이름 `was`
#   - 127.0.0.1:8080 listen 과 Tailscale Serve 는 없다 (브라우저는 http://localhost 로 접속.
#     localhost 는 브라우저가 보안 컨텍스트로 취급하므로 카메라·crypto.randomUUID 가 그대로 동작한다)
#   - Suricata/EveBox 는 호스트 네트워크 인터페이스가 필요해 compose 에 포함하지 않았다
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    add_header Permissions-Policy "camera=(self)" always;

    location = /nginx-health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"luck-nginx"}\n';
    }

    # Docker 내장 DNS 로 매번 다시 조회한다. 고정 proxy_pass 는 시작 시 한 번만 IP 를 풀어서
    # was 컨테이너가 재생성(재빌드)돼 IP 가 바뀌면 502 가 난다.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $was_upstream http://was:8000;

    location / {
        proxy_pass $was_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
