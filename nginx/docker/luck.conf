# Docker 전용 서버 블록. 서버용 conf.d/luck.conf 와 차이:
#   - upstream 이 Tailscale IP 가 아니라 compose 서비스 이름 `was`
#   - 127.0.0.1:8080 listen 과 Tailscale Serve 는 없다 (브라우저는 http://localhost 로 접속.
#     localhost 는 브라우저가 보안 컨텍스트로 취급하므로 카메라·crypto.randomUUID 가 그대로 동작한다)
#   - Suricata/EveBox 는 호스트 네트워크 인터페이스가 필요해 compose 에 포함하지 않았다
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    add_header Permissions-Policy "camera=(self)" always;

    location = /nginx-health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"luck-nginx"}\n';
    }

    # Docker 내장 DNS 로 매번 다시 조회한다. 고정 proxy_pass 는 시작 시 한 번만 IP 를 풀어서
    # was 컨테이너가 재생성(재빌드)돼 IP 가 바뀌면 502 가 난다.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $was_upstream http://was:8000;
    set $grafana_upstream http://grafana:3000;

    # 관리자 대시보드 SPA 경로. 서버용 conf.d/luck.conf 와 같이 edge 에서 먼저 관리자 검사를 한다.
    location = /dashboard {
        auth_request /_auth/admin;
        proxy_pass $was_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /grafana {
        return 308 /grafana/;
    }

    # 내부 전용 인증 서브요청. WAS 세션 cookie 만 전달하고 클라이언트가 보낸 Grafana 식별 헤더는 신뢰하지 않는다.
    location = /_auth/admin {
        internal;
        proxy_pass $was_upstream/api/auth/admin-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Original-URI $request_uri;
    }

    # Grafana 는 nginx 뒤 /grafana/ 로만 접근한다 (auth.proxy: WAS 관리자 계정 = Grafana 사용자).
    location /grafana/ {
        auth_request /_auth/admin;
        auth_request_set $grafana_user $upstream_http_x_auth_request_user;
        proxy_pass $grafana_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-WEBAUTH-USER $grafana_user;
        proxy_set_header X-WEBAUTH-ROLE "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_redirect off;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
    }

    location / {
        proxy_pass $was_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
