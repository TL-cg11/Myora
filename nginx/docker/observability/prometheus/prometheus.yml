# Docker 전용 Prometheus 설정. sink 워커의 metric 포트를 compose 서비스 이름으로 수집한다.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: luck-security-sinks
    static_configs:
      - targets:
          - "security-event-sink:9108"
          - "masked-log-sink:9109"
        labels:
          metrics_scope: "security-sinks"
