# Docker 전용 datasource. observability/grafana/provisioning/datasources/datasources.yml 과 같고
# 주소만 compose 서비스 이름이다. 대시보드·알림 provisioning 은 원본 파일을 그대로 마운트한다.
apiVersion: 1

deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Loki
    orgId: 1
  - name: Security Monitoring MariaDB
    orgId: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false

  - name: Security Monitoring MariaDB
    uid: security-monitoring-mysql
    type: mysql
    access: proxy
    url: ${GRAFANA_SECURITY_DB_HOST}:${GRAFANA_SECURITY_DB_PORT}
    user: ${GRAFANA_SECURITY_DB_USER}
    editable: false
    jsonData:
      database: security_monitoring
      maxOpenConns: 10
      maxIdleConns: 2
      connMaxLifetime: 14400
    secureJsonData:
      password: ${GRAFANA_SECURITY_DB_PASSWORD}
