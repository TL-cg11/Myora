server {
    # TLS is terminated by Tailscale Serve on :443. Keep the Nginx backend
    # loopback-only so clients cannot bypass HTTPS with the Tailscale IP.
    listen 127.0.0.1:8080 default_server;
    server_name _;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(self)" always;

    location = /nginx-health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"luck-nginx"}\n';
    }

    location / {
        proxy_pass http://100.66.77.55:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
